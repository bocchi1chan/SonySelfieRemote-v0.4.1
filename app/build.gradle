plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sonyselfieremote'
    compileSdk 35

    defaultConfig {
        applicationId "com.sonyselfieremote"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "0.4.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
